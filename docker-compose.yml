services:
  db:
    image: postgres:16
    container_name: form-discord-db
    restart: unless-stopped
    ports:
      # Loopback only: Docker bypasses ufw via iptables, so a bare '5432:5432'
      # would expose this Postgres to the internet on a VPS.
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: formdiscord
      POSTGRES_DB: formdiscord
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (no default password)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U formdiscord -d formdiscord']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
