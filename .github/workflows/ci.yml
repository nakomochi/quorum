name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: formdiscord
          POSTGRES_PASSWORD: formdiscord
          POSTGRES_DB: formdiscord
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U formdiscord -d formdiscord"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Placeholders only. The tests replace every one of these but DATABASE_URL (see
    # tests/setup/preload.ts) and stub Discord; the build reads none of them.
    env:
      DATABASE_URL: postgres://formdiscord:formdiscord@localhost:5432/formdiscord
      BETTER_AUTH_SECRET: ci-placeholder-secret-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:5173
      ORIGIN: http://localhost:5173
      DISCORD_CLIENT_ID: ci-placeholder
      DISCORD_CLIENT_SECRET: ci-placeholder
      DISCORD_BOT_TOKEN: ci-placeholder
      DISCORD_GUILD_ID: '0'
      CRON_SECRET: ci-placeholder

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - id: install
        run: bun install --frozen-lockfile

      # Each check runs even when an earlier one failed, so one run reports every failure.
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run lint

      - name: Type check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run check

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run test

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run build
